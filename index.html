<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>设计工作台</title>
    <link rel="stylesheet" href="./public/styles.css?v=20260528-border" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <span class="brand-dot"></span>
        <span>设计工作台</span>
      </div>
      <button class="ghost-btn" data-open-modal="settingsModal" hidden aria-hidden="true" tabindex="-1">设置接口</button>
    </header>

    <main class="home">
      <section class="hero">
        <p class="label">DESIGN WORKBENCH</p>
        <h1>把麻烦的设计活，变成一键处理。</h1>
        <p class="hero-text">
          选一个功能，填一点信息，剩下的交给网页处理。所有操作都在弹窗里完成，不用来回找入口。
        </p>
      </section>

      <section class="entry-grid" aria-label="功能入口">
        <button class="entry-card card-blue" data-open-modal="researchModal">
          <span>01</span>
          <strong>查竞品</strong>
          <em>告诉我目标和竞品，一键生成分析报告。</em>
        </button>
        <button class="entry-card card-green" data-open-modal="styleModal">
          <span>02</span>
          <strong>换风格</strong>
          <em>上传框架图和参考图，生成 3 张新方向。</em>
        </button>
        <button class="entry-card card-yellow" data-open-modal="auditModal">
          <span>03</span>
          <strong>查差异</strong>
          <em>上传两张图，在实现图上标出问题。</em>
        </button>
      </section>
    </main>

    <div class="modal" id="researchModal" aria-hidden="true">
      <div class="modal-panel modal-wide">
        <div class="modal-head">
          <div>
            <p class="label">查竞品</p>
            <h2>输入一句话，生成报告</h2>
          </div>
          <button class="icon-btn" data-close-modal>×</button>
        </div>
        <label class="field">
          你想分析什么？
          <textarea id="researchInput" placeholder="例如：我要做一个给 UI 设计师用的 AI 工具站，竞品可以看 Galileo、Uizard、Figma AI、Motiff，帮我分析它们怎么做、用户痛点和我的差异化方向。"></textarea>
        </label>
        <div class="modal-actions">
          <button class="primary-btn" id="runResearchBtn">生成报告</button>
          <button class="ghost-btn" id="copyResearchBtn">复制报告</button>
        </div>
        <article class="markdown-card" id="researchReport">报告会显示在这里。</article>
      </div>
    </div>

    <div class="modal" id="styleModal" aria-hidden="true">
      <div class="modal-panel modal-wide">
        <div class="modal-head">
          <div>
            <p class="label">换风格</p>
            <h2>用参考图重新设计</h2>
          </div>
          <button class="icon-btn" data-close-modal>×</button>
        </div>
        <div class="two-fields">
          <label class="upload-card">
            <span class="upload-title">框架图</span>
            <small class="upload-desc">只提取内容和结构</small>
            <input class="file-input" id="frameImageInput" type="file" accept="image/*" />
            <span class="file-trigger">选择图片</span>
            <small class="file-name" data-file-name-for="frameImageInput">还没有选择图片</small>
          </label>
          <label class="upload-card">
            <span class="upload-title">参考图</span>
            <small class="upload-desc">只提取风格和感觉</small>
            <input class="file-input" id="styleImageInput" type="file" accept="image/*" />
            <span class="file-trigger">选择图片</span>
            <small class="file-name" data-file-name-for="styleImageInput">还没有选择图片</small>
          </label>
        </div>
        <div class="modal-actions">
          <button class="primary-btn" id="runStyleBtn">生成 3 张图</button>
          <button class="ghost-btn" id="copyStyleBtn">复制提示词</button>
        </div>
        <p class="action-note" id="styleCopyStatus" aria-live="polite">生成图片后，可以复制这次的出图提示词。</p>
        <p class="hint">当前图片模型更适合“方向探索”，会尽量保持框架图内容，但不是 Figma 级精准还原。</p>
        <div class="image-result-grid" id="styleResults"></div>
      </div>
    </div>

    <div class="modal" id="auditModal" aria-hidden="true">
      <div class="modal-panel modal-wide">
        <div class="modal-head">
          <div>
            <p class="label">查差异</p>
            <h2>直接在实现图上标问题</h2>
          </div>
          <button class="icon-btn" data-close-modal>×</button>
        </div>
        <div class="two-fields">
          <label class="upload-card">
            <span class="upload-title">设计稿</span>
            <small class="upload-desc">作为标准</small>
            <input class="file-input" id="designInput" type="file" accept="image/*" />
            <span class="file-trigger">选择图片</span>
            <small class="file-name" data-file-name-for="designInput">还没有选择图片</small>
          </label>
          <label class="upload-card">
            <span class="upload-title">实现图</span>
            <small class="upload-desc">在这张图上标问题</small>
            <input class="file-input" id="realInput" type="file" accept="image/*" />
            <span class="file-trigger">选择图片</span>
            <small class="file-name" data-file-name-for="realInput">还没有选择图片</small>
          </label>
        </div>
        <div class="modal-actions">
          <button class="primary-btn" id="runAuditBtn">开始对比</button>
          <button class="ghost-btn" id="saveAuditImageBtn">保存标注图</button>
        </div>
        <div class="audit-layout">
          <canvas id="auditCanvas"></canvas>
          <div class="plain-report" id="auditText">结果会显示在这里。</div>
        </div>
      </div>
    </div>

    <div class="modal" id="settingsModal" aria-hidden="true">
      <div class="modal-panel">
        <div class="modal-head">
          <div>
            <p class="label">接口设置</p>
            <h2>填好后才能一键生成</h2>
          </div>
          <button class="icon-btn" data-close-modal>×</button>
        </div>
        <label class="field">
          Tavily Key
          <input id="tavilyKey" type="password" placeholder="用来联网查资料" />
        </label>
        <label class="field">
          Gemini Key
          <input id="geminiKey" type="password" placeholder="用来整理报告和理解图片" />
        </label>
        <label class="field">
          Gemini 模型
          <input id="geminiModel" placeholder="gemini-2.5-flash" />
        </label>
        <label class="field">
          Cloudflare Account ID
          <input id="cloudflareAccountId" placeholder="不是 Token，一般是一串 32 位左右的账号 ID" />
        </label>
        <label class="field">
          Cloudflare Token
          <input id="cloudflareApiToken" type="password" placeholder="以 cfat_ 开头的 Token 填这里" />
        </label>
        <label class="field">
          图片模型
          <input id="cloudflareImageModel" placeholder="@cf/black-forest-labs/flux-1-schnell" />
        </label>
        <button class="primary-btn full" id="saveSettingsBtn">保存</button>
      </div>
    </div>

    <script src="./public/app.js?v=20260528-modal-safe"></script>
  </body>
</html>
